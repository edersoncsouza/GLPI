name: glpi

services:

  glpi:
    image: "glpi/glpi:11.0.9"
    restart: "unless-stopped"
    volumes:
      - glpi_data:/var/glpi
      - ./filacircular:/var/www/glpi/plugins/filacircular
      - ./overrides/GLPIMailer.php:/var/www/glpi/src/GLPIMailer.php
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
    depends_on:
      - db
    ports:
      - "8080:80"

  db:
    image: "mysql:8.4"
    restart: "unless-stopped"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
      TZ: America/Sao_Paulo

volumes:
  glpi_data:
  db_data:
