name: glpi

services:

  glpi:
    image: "glpi/glpi:11.0.3"
    restart: "unless-stopped"
    volumes:
      - glpi_data:/var/glpi
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:80"

  db:
    image: "mysql:8.4"
    restart: "unless-stopped"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}

volumes:
  glpi_data:
  db_data:
